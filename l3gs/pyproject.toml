[project]
name = "l3gs"
version = "0.1.1"
requires-python = ">=3.8"

dependencies=[
    "nerfstudio == 1.1.1",
    "Pillow >=9.3.0, <=10.3.0",
    "urllib3==1.26.15",
    "open-clip-torch==2.23.0",
    "numpy==1.23.5",
    "pydantic==1.9.0"
]
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["l3gs*"]

[project.entry-points.'nerfstudio.method_configs']
l3gs = 'l3gs.L3GS_config:l3gs_method'
